<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background / Soft glow -->
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff5f0" stop-opacity="0" />
    </radialGradient>

    <!-- Male Duck Gradients -->
    <linearGradient id="maleCrest" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#285943" />
      <stop offset="50%" stop-color="#3c7a65" />
      <stop offset="100%" stop-color="#559982" />
    </linearGradient>
    <radialGradient id="maleBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5e1cb" />
      <stop offset="65%" stop-color="#d9ad84" />
      <stop offset="100%" stop-color="#b88358" />
    </radialGradient>
    <linearGradient id="maleWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5247" />
      <stop offset="40%" stop-color="#527d70" />
      <stop offset="75%" stop-color="#bd6d3b" />
      <stop offset="100%" stop-color="#8a4823" />
    </linearGradient>
    <linearGradient id="maleChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73322b" />
      <stop offset="100%" stop-color="#54201c" />
    </linearGradient>

    <!-- Female Duck Gradients -->
    <radialGradient id="femaleBody" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f7ede2" />
      <stop offset="60%" stop-color="#dac0a8" />
      <stop offset="100%" stop-color="#ba9677" />
    </radialGradient>
    <linearGradient id="femaleWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9aa8d" />
      <stop offset="50%" stop-color="#ad8866" />
      <stop offset="100%" stop-color="#8a6344" />
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9922" />
      <stop offset="100%" stop-color="#e86b00" />
    </linearGradient>

    <!-- Eye Gradient -->
    <radialGradient id="eyeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d2219" />
      <stop offset="70%" stop-color="#1c0f0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Bow Tie Gradient (Navy) -->
    <linearGradient id="bowTieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#364559" />
      <stop offset="100%" stop-color="#1b2533" />
    </linearGradient>

    <!-- Pink Ribbon Gradient -->
    <linearGradient id="pinkRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3a7" />
      <stop offset="100%" stop-color="#e88574" />
    </linearGradient>

    <!-- Feet Gradient -->
    <linearGradient id="feetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f58e1d" />
      <stop offset="100%" stop-color="#cc6104" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#softGlow)" />

  <!-- Drop Shadow under feet -->
  <ellipse cx="190" cy="420" rx="90" ry="16" fill="#000000" opacity="0.12" />
  <ellipse cx="320" cy="420" rx="85" ry="16" fill="#000000" opacity="0.12" />

  <!-- ==================== MALE DUCK (LEFT) ==================== -->
  <g id="maleDuck">
    <!-- Tail Feathers -->
    <path d="M 120 340 C 90 330 65 300 70 280 C 85 305 105 325 130 335 Z" fill="#e8833a" />
    <path d="M 105 355 C 80 350 60 330 65 315 C 80 330 100 345 120 350 Z" fill="#426b5d" />

    <!-- Feet -->
    <g fill="url(#feetGrad)">
      <!-- Left Foot -->
      <path d="M 145 400 C 145 400 130 420 120 422 C 130 424 145 423 152 418 C 158 424 165 423 170 417 C 172 410 162 400 162 400 Z" />
      <!-- Right Foot -->
      <path d="M 205 398 C 205 398 195 418 188 420 C 196 422 208 421 214 416 C 220 422 227 420 231 414 C 232 408 220 398 220 398 Z" />
    </g>

    <!-- Main Chubby Body -->
    <ellipse cx="195" cy="305" rx="95" ry="85" fill="url(#maleBody)" />

    <!-- Head & Crest -->
    <circle cx="205" cy="205" r="72" fill="url(#maleBody)" />
    <!-- Crest / Teal Crown -->
    <path d="M 148 190 C 150 145 185 135 210 135 C 235 135 255 150 255 180 C 240 165 220 160 205 162 C 185 165 165 175 148 190 Z" fill="url(#maleCrest)" />
    <path d="M 200 135 C 215 150 220 195 215 225 C 210 215 205 190 198 175 C 192 160 195 145 200 135 Z" fill="#2d6e56" opacity="0.6" />

    <!-- Male Wing & Striped Feathers -->
    <path d="M 105 320 C 110 260 145 240 180 250 C 170 290 145 350 115 355 C 105 350 102 335 105 320 Z" fill="url(#maleWing)" />
    <!-- Wing White & Black Bar Stripes -->
    <path d="M 142 278 C 150 295 145 320 135 340" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 149 280 C 157 298 152 322 142 342" stroke="#222222" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Chest Plumage (Rich Chestnut Maroon) -->
    <path d="M 160 270 C 160 270 185 260 215 270 C 235 295 220 335 190 335 C 165 335 150 300 160 270 Z" fill="url(#maleChest)" />

    <!-- Cheeks (Blush) -->
    <circle cx="160" cy="225" r="16" fill="#fca879" opacity="0.5" />
    <circle cx="235" cy="225" r="16" fill="#fca879" opacity="0.5" />

    <!-- Eyes (Big glossy dark eyes) -->
    <!-- Left Eye -->
    <ellipse cx="178" cy="205" rx="9" ry="11" fill="url(#eyeGrad)" />
    <circle cx="175" cy="200" r="3.5" fill="#ffffff" />
    <circle cx="180" cy="208" r="1.5" fill="#ffffff" />
    <!-- Right Eye -->
    <ellipse cx="232" cy="208" rx="8.5" ry="10.5" fill="url(#eyeGrad)" />
    <circle cx="229" cy="203" r="3.5" fill="#ffffff" />
    <circle cx="234" cy="211" r="1.5" fill="#ffffff" />

    <!-- Beak -->
    <path d="M 190 215 C 190 205 218 205 222 215 C 224 225 215 238 206 238 C 197 238 189 225 190 215 Z" fill="url(#beakGrad)" />
    <!-- Beak highlight & nostrils -->
    <ellipse cx="206" cy="217" rx="6" ry="2" fill="#ffbe6b" opacity="0.8" />
    <circle cx="201" cy="214" r="1" fill="#8c3800" />
    <circle cx="210" cy="214" r="1" fill="#8c3800" />

    <!-- Navy Bow Tie with Peach Heart -->
    <g id="bowtie">
      <!-- Left Knot -->
      <polygon points="190,265 170,253 168,277" fill="url(#bowTieGrad)" />
      <!-- Right Knot -->
      <polygon points="214,265 234,253 236,277" fill="url(#bowTieGrad)" />
      <!-- Center Heart -->
      <path d="M 202 263 C 202 258 196 257 196 262 C 196 266 202 271 202 271 C 202 271 208 266 208 262 C 208 257 202 258 202 263 Z" fill="#ffb4a3" />
    </g>
  </g>

  <!-- ==================== FEMALE DUCK (RIGHT) ==================== -->
  <g id="femaleDuck">
    <!-- Tail Feathers -->
    <path d="M 400 335 C 425 320 440 295 440 275 C 425 298 410 320 385 330 Z" fill="#b38e6d" />

    <!-- Feet -->
    <g fill="url(#feetGrad)">
      <!-- Left Foot -->
      <path d="M 285 400 C 285 400 275 418 268 420 C 276 422 288 421 294 416 C 300 422 307 420 311 414 C 312 408 300 400 300 400 Z" />
      <!-- Right Foot -->
      <path d="M 345 402 C 345 402 335 420 328 422 C 336 424 348 423 354 418 C 360 424 367 422 371 416 C 372 410 360 402 360 402 Z" />
    </g>

    <!-- Main Chubby Body (Leaning slightly left) -->
    <ellipse cx="325" cy="305" rx="90" ry="85" fill="url(#femaleBody)" transform="rotate(-6 325 305)" />

    <!-- Scalloped Feather Pattern on Chest/Tummy -->
    <g stroke="#c7a78b" stroke-width="2.5" fill="none" opacity="0.65" stroke-linecap="round">
      <path d="M 280 290 Q 290 298 300 290 Q 310 298 320 290 Q 330 298 340 290" />
      <path d="M 275 310 Q 285 318 295 310 Q 305 318 315 310 Q 325 318 335 310 Q 345 318 355 310" />
      <path d="M 285 330 Q 295 338 305 330 Q 315 338 325 330 Q 335 338 345 330" />
      <path d="M 300 350 Q 310 358 320 350 Q 330 358 340 350" />
    </g>

    <!-- Wing -->
    <path d="M 395 320 C 390 265 355 245 325 255 C 335 295 360 350 390 355 C 398 348 398 335 395 320 Z" fill="url(#femaleWing)" />

    <!-- Head (Tilted slightly touching male duck's head) -->
    <circle cx="310" cy="210" r="68" fill="url(#femaleBody)" />

    <!-- Crown Feather Detail -->
    <path d="M 325 150 C 345 160 360 185 365 210 C 355 190 340 175 325 168 Z" fill="#9e7b5f" opacity="0.4" />

    <!-- Cheeks (Blush) -->
    <circle cx="270" cy="230" r="16" fill="#fca879" opacity="0.5" />
    <circle cx="340" cy="228" r="16" fill="#fca879" opacity="0.5" />

    <!-- Eyes (Gentle sweet glossy eyes) -->
    <!-- Left Eye -->
    <ellipse cx="277" cy="214" rx="8" ry="10" fill="url(#eyeGrad)" />
    <circle cx="275" cy="209" r="3" fill="#ffffff" />
    <circle cx="279" cy="217" r="1.3" fill="#ffffff" />
    <!-- Right Eye -->
    <ellipse cx="330" cy="212" rx="8" ry="10" fill="url(#eyeGrad)" />
    <circle cx="328" cy="207" r="3" fill="#ffffff" />
    <circle cx="332" cy="215" r="1.3" fill="#ffffff" />

    <!-- Beak -->
    <path d="M 288 222 C 288 212 314 212 318 222 C 320 231 312 242 303 242 C 294 242 287 231 288 222 Z" fill="url(#beakGrad)" />
    <!-- Beak highlight & nostrils -->
    <ellipse cx="303" cy="224" rx="5.5" ry="2" fill="#ffbe6b" opacity="0.8" />
    <circle cx="298" cy="221" r="1" fill="#8c3800" />
    <circle cx="307" cy="221" r="1" fill="#8c3800" />

    <!-- Pink Ribbon on Head -->
    <g id="pinkBow" transform="translate(325, 155) rotate(15)">
      <!-- Left Ribbon Loop -->
      <ellipse cx="-15" cy="0" rx="14" ry="10" fill="url(#pinkRibbon)" transform="rotate(-20 -15 0)" />
      <!-- Right Ribbon Loop -->
      <ellipse cx="15" cy="0" rx="14" ry="10" fill="url(#pinkRibbon)" transform="rotate(20 15 0)" />
      <!-- Center Knot / Heart -->
      <circle cx="0" cy="0" r="7" fill="#f27d6d" />
      <path d="M 0 -2 C 0 -5 -4 -6 -4 -3 C -4 0 0 3 0 3 C 0 3 4 0 4 -3 C 4 -6 0 -5 0 -2 Z" fill="#ffe5e0" />
    </g>
  </g>

  <!-- Little Warm Heart Above Heads -->
  <g transform="translate(254, 128)">
    <path d="M 0 -8 C 0 -15 -10 -18 -10 -10 C -10 -4 0 4 0 4 C 0 4 10 -4 10 -10 C 10 -18 0 -15 0 -8 Z" fill="#e86b58" opacity="0.85" />
  </g>
</svg>
